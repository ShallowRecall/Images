name: Optimize images

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'

permissions:
  contents: write

concurrency:
  group: optimize-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'optimize images') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install --no-save --no-package-lock sharp@0.33.5

      - name: Optimize changed images
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node .github/scripts/optimize-images.mjs

      - name: Commit optimized images
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: optimize images"
          git push
